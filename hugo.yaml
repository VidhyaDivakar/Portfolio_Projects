baseURL: "https://VidhyaDivakar.github.io/Portfolio_Projects/"
title: "Portfolio_Projects"
languageCode: "en"
theme: "docsy"
publishDir: "public"

params:
  description: "A collection of projects"
  author: "Vidhya Divakar"
  enable_comments: true
  enable_analytics: true

permalinks:
  posts: /:year/:title/

module:
  hugoVersion:
    extended: true
    min: "0.110.0"
  imports:
    - path: "github.com/google/docsy"

ignoreLogs:
  - "warning-goldmark-raw-html"

markup:
  goldmark:
    renderer:
      unsafe: true

outputs:
  section:
    - HTML
    - print
    - RSS
