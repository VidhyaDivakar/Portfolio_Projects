name: Deploy Hugo site to GitHub Pages

on:
    push:
        branches:
            - main # Trigger deployment on pushes to main

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            # 1️⃣ Checkout your repo including submodules (Docsy theme)
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  submodules: true # important for Docsy theme submodule
                  fetch-depth: 0 # Fetch all history for accurate Hugo module handling

            # 2️⃣ Setup Hugo (extended version needed for SCSS support)
            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v2
              with:
                  hugo-version: latest
                  extended: true

            # 3️⃣ Build your Hugo site with minification
            - name: Build Hugo site
              env:
                  HUGO_ENV: production
                  HUGO_ENABLEGITINFO: true
              run: hugo --minify

            # 4️⃣ Upload the generated public folder as artifact for Pages
            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./public

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            # 5️⃣ Deploy the uploaded artifact to GitHub Pages
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
