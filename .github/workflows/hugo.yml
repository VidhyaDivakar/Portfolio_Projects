name: Deploy Hugo site to GitHub Pages

on:
    push:
        branches:
            - main # Trigger deployment on pushes to main
    workflow_dispatch: # Allow manual triggering of the workflow

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            # 1️⃣ Checkout your repo including submodules (Docsy theme)
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  submodules: true # important for Docsy theme submodule
                  fetch-depth: 0 # Fetch all history for accurate Hugo module handling

            # 🟢 ADD THIS: Setup Node.js to use PostCSS
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install PostCSS
              run: npm install -D postcss postcss-cli autoprefixer
              # 🟢 ADD THIS: Install Docsy dependencies
            # Docsy requires PostCSS, Autoprefixer, and sometimes specific Bootstrap versions Docsy uses PostCSS for Autoprefixer and SCSS compilation.
            # Without a npm install step, these tools are missing from the runner's path, causing the TOCSS transformation to fail

            # When Hugo runs at the root of your project, it looks for postcss in the root's node_modules. Even though you installed them inside themes/docsy, Hugo often can't "see" them there.
            # The Fix: You need to install the dependencies in the root folder as well so the tools are globally available to the Hugo process.
            - name: Install Root Level Dependencies
              run: npm install
            - name: Install Docsy Root Level Dependencies
              run: cd themes/docsy && npm install
            # 2️⃣ Setup Hugo (extended version needed for SCSS support)
            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v3
              with:
                  hugo-version: latest
                  extended: true #mandatory for themes using SCSS, like Docsy, bootstrap

            # 3️⃣ Build your Hugo site with minification
            - name: Build Hugo site
              env:
                  HUGO_ENV: production
                  HUGO_ENABLEGITINFO: true
              run: |
                  hugo mod clean
                  hugo mod get
                  hugo --gc --minify

            # 4️⃣ Upload the generated public folder as artifact for Pages
            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./public

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            # 5️⃣ Deploy the uploaded artifact to GitHub Pages
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
